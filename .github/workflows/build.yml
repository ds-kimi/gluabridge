name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dll:
    name: DLL (win64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Test
        run: cargo +nightly test --manifest-path autorun/Cargo.toml

      - name: Build
        run: |
          cargo +nightly build --release --manifest-path autorun/Cargo.toml
          move target\release\autorun.dll gmsv_autorun_win64.dll

      - uses: actions/upload-artifact@v4
        with:
          name: dll
          path: gmsv_autorun_win64.dll

  extension:
    name: VSCode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gluabridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Compiled explicitly rather than relying on vsce's vscodePrepublish hook,
      # which does not fire reliably when vsce is invoked through npx.
      - name: Compile
        run: npm run compile

      - name: Package
        run: npx --yes @vscode/vsce package --skip-license --out gluabridge.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: gluabridge/gluabridge.vsix

  release:
    name: Publish Release
    needs: [dll, extension]
    # Only the default branch publishes; PR builds stop at artifacts.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A single rolling "Release" tag, moved to whatever commit built last.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Release
          name: Release
          make_latest: true
          prerelease: false
          body: |
            Latest build of `${{ github.sha }}`.

            * `gmsv_autorun_win64.dll` -- inject, or drop in `garrysmod/lua/bin/`
            * `gluabridge.vsix` -- install with `code --install-extension gluabridge.vsix`
          files: |
            artifacts/dll/gmsv_autorun_win64.dll
            artifacts/vsix/gluabridge.vsix
